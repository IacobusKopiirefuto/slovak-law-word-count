[build-system]
requires = ["uv_build >= 0.10.4, <0.11.0"]
build-backend = "uv_build"

[project]
name = "slovak-law-word-count"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
  {name = "Jakub Škoda"},
]
description = "Measuring Slovak law's growing word count (and other metrics)"
keywords = ["nlp", "law", "Slovakia", "slov-lex"]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: Slovak",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "beautifulsoup4==4.12.2",
    "certifi==2023.11.17",
    "charset-normalizer==3.3.2",
    "contourpy==1.2.0",
    "cycler==0.12.1",
    "emoji==2.8.0",
    "filelock==3.13.1",
    "fonttools==4.45.1",
    "fsspec==2023.10.0",
    "idna==3.7",
    "jinja2==3.1.4",
    "kiwisolver==1.4.5",
    "markupsafe==2.1.3",
    "matplotlib==3.8.2",
    "mpmath==1.3.0",
    "networkx==3.2.1",
    "numpy==1.26.2",
    "packaging==23.2",
    "pillow==10.3.0",
    "pyparsing==3.1.1",
    "python-dateutil==2.8.2",
    "requests==2.32.0",
    "six==1.16.0",
    "soupsieve==2.5",
    "sympy==1.12",
    "tqdm==4.66.3",
    "typing-extensions==4.8.0",
    "urllib3==2.2.2",
]

[project.optional-dependencies]
gui = ["PySimpleGUI==4.60.5"]
stanza = [
    "protobuf==4.25.1",
    "pyphen==0.14.0",
    "stanza==1.6.1",
    "torch==2.1.1",
    "wordcloud==1.9.2",
]
gpu = [
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cuda-cupti-cu12==12.1.105",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
    "nvidia-cuda-runtime-cu12==12.1.105",
    "nvidia-cudnn-cu12==8.9.2.26",
    "nvidia-cufft-cu12==11.0.2.54",
    "nvidia-curand-cu12==10.3.2.106",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cusparse-cu12==12.1.0.106",
    "nvidia-nccl-cu12==2.18.1",
    "nvidia-nvjitlink-cu12==12.3.101",
    "nvidia-nvtx-cu12==12.1.105",
    "triton==2.1.0",
]

[project.urls]
Repository = "https://github.com/IacobusKopiirefuto/slovak-law-word-count"
Issues = "https://github.com/IacobusKopiirefuto/slovak-law-word-count/issues"

[project.scripts]
slovak-law-word-count = "slovak_law_word_count.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", # incompatible with D211; we prefer no blank line before class docstrings
  "D213", # incompatible with D212; we prefer summary text on the first docstring line
  "E501", # line length is formatter-managed; keep rare long lines when wrapping hurts readability
  "ERA001", # temporary: keep commented-out code visible until it is reviewed and removed
  ]

unfixable = [
  "T201" # report `print`, but do not auto-delete it to avoid accidental behavior changes
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
